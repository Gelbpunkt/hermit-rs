[package]
name = "rust-tcp-io-perf"
authors = ["Lorenzo Martini <lmartini@student.ethz.ch>"]
edition = "2021"
readme = "README.md"

description = "A Rust program to measure bandwidth or latency over a Rust TCP connection"

[dependencies]
bytes = "1.1"
clap = { version ="4.1", features = ["derive"] }
core_affinity = "0.8"
env_logger = "0.11"
hdrhist = "0.5"
log = "0.4"
#rftrace = "0.2"
#rftrace-frontend = "0.2"

[target.'cfg(target_os = "hermit")'.dependencies]
hermit = { path = "../../hermit", default-features = false, features = ["acpi", "fs", "pci", "pci-ids", "smp", "fsgsbase", "tcp", "dhcpv4"] } # , "instrument"] }

[[bin]]
name = "server-bw"
path = "src/rust-tcp-bw/server.rs"

[[bin]]
name = "client-bw"
path = "src/rust-tcp-bw/client.rs"

[[bin]]
name = "server-latency"
path = "src/rust-tcp-latency/server.rs"

[[bin]]
name = "client-latency"
path = "src/rust-tcp-latency/client.rs"
